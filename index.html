<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
}

.header {
  background: #fff;
  padding: 16px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.logo {
  max-height: 80px;
}

#formArea {
  padding: 16px;
  padding-bottom: 100px;
}

#formArea div {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
  color: #444;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
  box-sizing: border-box; 
}

/* ✅ ファイル＋カメラ横並び */
.file-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.file-row input[type="file"] {
  flex: 1;
}

.camera-btn {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: #eee;
  font-size: 16px;
  white-space: nowrap;
  cursor: pointer;
}

/* サムネ */
.preview {
  width: 80px;
  margin-top: 10px;
  display: none;
}

/* 送信ボタン */
button.submit {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 16px;
  font-size: 18px;
  background: #0078d4;
  color: #fff;
  border: none;
}

.spinner {
  display: none;
  width: 20px;
  height: 20px;
  border: 3px solid #fff;
  border-top: 3px solid transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-left: 10px;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="header">
  <img id="logo" class="logo">
</div>

<div id="formArea"></div>
<div id="reader" style="width:300px; margin:16px;"></div>

<button id="submitBtn" class="submit" onclick="submitForm()">
  <span id="btnText">送信</span>
  <span id="spinner" class="spinner"></span>
</button>

<script>

const formType = new URLSearchParams(location.search).get("form");
const draftKey = "draft_" + formType;
let draft = {};

// 下書き取得
try {
  draft = JSON.parse(localStorage.getItem(draftKey)) || {};
} catch {
  draft = {};
}

// JSON読み込み
fetch(`./forms/${formType}.json`)
  .then(res => res.json())
  .then(config => {

    
    console.log("formType:", formType);
    console.log("currentConfig BEFORE:", window.currentConfig);
    console.log("config:", config);

    setLogo(config.logo);
    window.currentConfig = config;
    renderForm(config.fields);
  })
  .catch(err => {
    console.error(err);
    alert("フォーム読み込みエラー");
  });


function setLogo(logoPath) {
  document.getElementById("logo").src = logoPath || "/logo.png";
}

function startBarcodeScanner(targetBind) {

  const html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {

      // ✅ 値をinputに反映
      const input = document.querySelector(`[data-bind="${targetBind}"]`);
      if (input) {
        input.value = decodedText;
        saveDraft(targetBind, decodedText);
      }

      html5QrCode.stop();
    },
    (error) => {
      // 読取中エラー（無視でOK）
    }
  );
}

  
// 下書き保存
function saveDraft(key, value) {
  draft[key] = value;
  localStorage.setItem(draftKey, JSON.stringify(draft));
}

// フォーム生成
function renderForm(fields) {
  const area = document.getElementById("formArea");

  fields.forEach(item => {
    const div = document.createElement("div");

const label = document.createElement("label");

label.innerHTML =
  item.label +
  (item.required
    ? ' <span style="color:red;">*</span>'
    : '');

div.appendChild(label);

    // TEXT
   
if (item.type === "text") {
  const input = document.createElement("input");
  input.type = "text";
  input.dataset.bind = item.bind;
  input.required = item.required || false;
  input.value = draft[item.bind] || "";

  input.oninput = () => saveDraft(item.bind, input.value);
  div.appendChild(input);

  // ✅ バーコードボタン
  if (item.enableScan) {
    const btn = document.createElement("button");
    btn.textContent = "📷読取";
    btn.type = "button";
    btn.style.marginTop = "8px";

    btn.onclick = () => startBarcodeScanner(item.bind);

    div.appendChild(btn);
  }
}


  // ✅ TEXTAREA
    if (item.type === "textarea") {
      const textarea = document.createElement("textarea");
      textarea.dataset.bind = item.bind;
      textarea.rows = 4;
      textarea.value = draft[item.bind] || "";
      textarea.required = item.required || false;

      textarea.oninput = () => saveDraft(item.bind, textarea.value);
      
    div.appendChild(textarea);
    }

    // SELECT
    if (item.type === "select") {
  const select = document.createElement("select");
  select.dataset.bind = item.bind;
  select.required = item.required || false;     

  item.options.forEach(opt => {
    const option = document.createElement("option");
    option.value = opt;
    option.text = opt;
    select.appendChild(option);
  });

  select.value = draft[item.bind] || "";

  div.appendChild(select);

  // ✅ その他入力欄（自動生成）
  let otherInput = null;

  if (item.allowOther) {
    otherInput = document.createElement("input");
    otherInput.type = "text";
    otherInput.placeholder = "具体的に入力";
    otherInput.dataset.bind = item.bind + "_other";
    otherInput.value = draft[item.bind + "_other"] || "";

    // 初期表示制御
    otherInput.style.display =
      select.value === "その他" ? "block" : "none";

    otherInput.oninput = () =>
      saveDraft(otherInput.dataset.bind, otherInput.value);

    div.appendChild(otherInput);
  }

  // ✅ 選択変更時
  select.onchange = () => {
    saveDraft(item.bind, select.value);

    if (item.allowOther && otherInput) {
      otherInput.style.display =
        select.value === "その他" ? "block" : "none";
    }
  };
}
    // ✅ FILE（カメラボタン付き）
    if (item.type === "file") {

      const wrapper = document.createElement("div");
      wrapper.className = "file-row";

      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.dataset.bind = item.bind;
      input.required = item.required || false;

      // カメラボタン
      const cameraBtn = document.createElement("button");
      cameraBtn.textContent = "📷";
      cameraBtn.type = "button";
      cameraBtn.className = "camera-btn";

      cameraBtn.onclick = () => {
        input.capture = "environment"; // 背面カメラ
        input.click();
      };

      const preview = document.createElement("img");
      preview.className = "preview";

      // 復元
      if (draft[item.bind]) {
        preview.src = draft[item.bind];
        preview.style.display = "block";
      }

      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;

        const base64 = await readFile(file);
        preview.src = base64;
        preview.style.display = "block";

        saveDraft(item.bind, base64);
      };

      wrapper.appendChild(input);
      wrapper.appendChild(cameraBtn);

      div.appendChild(wrapper);
      div.appendChild(preview);
    }

    area.appendChild(div);
  });
}

// base64変換
function readFile(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

// 送信
// 送信
async function submitForm() {

 // ====================
  // 必須チェック
  // ====================
  for (const item of window.currentConfig.fields) {

    if (!item.required) {
      continue;
    }

    // ファイル
    if (item.type === "file") {

      if (!draft[item.bind]) {

        alert(item.label + " は必須です");

        return;
      }

    } else {

      const field =
        document.querySelector(
          `[data-bind="${item.bind}"]`
        );

      if (!field || !field.value.trim()) {

        alert(item.label + " は必須です");

        field?.focus();

        return;
      }
    }
  }

  const btn = document.getElementById("submitBtn");
  const text = document.getElementById("btnText");
  const spinner = document.getElementById("spinner");

  text.textContent = "送信中...";
  spinner.style.display = "inline-block";
  btn.disabled = true;

  const payload = {
    timestamp: new Date().toISOString(),
    formType: formType,
    formGroup: window.currentConfig.formGroup
  };

  for (const field of document.querySelectorAll("[data-bind]")) {

    const key = field.dataset.bind;


if (
  field.type === "text" ||
  field.tagName === "SELECT" ||
  field.tagName === "TEXTAREA"
) {
  payload[key] = field.value;
}


    if (field.type === "file") {
      if (draft[key]) {
        payload[key] = draft[key];
      }
    }
  }

function normalizePayload(payload) {
  Object.keys(payload).forEach(key => {

    if (payload[key] === "その他") {
      const otherKey = key + "_other";

      if (payload[otherKey]) {
        payload[key] = `その他(${payload[otherKey]})`;
        delete payload[otherKey];
      }
    }

  });
}

  // ✅ ★ここが正しい位置★
  normalizePayload(payload);

  await fetch("https://280f681b44d7ef19a1c9c1de4d1b9b.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/bf6dd4bdd6ba49c3bf3e27ad77dd6368/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=x2BhTjQMyzgZExNWLXACX7Ek-lS_awZdkm3KthzQQPM", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  localStorage.removeItem(draftKey);

  text.textContent = "送信完了 ✅";
  spinner.style.display = "none";

  setTimeout(() => {
    text.textContent = "送信";
    btn.disabled = false;
    location.reload();
  }, 1500);
}

</script>

</body>
</html>
