<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CE写真アップ</title>
</head>
<body>

<h2>写真アップフォーム</h2>

<input type="text" id="name" placeholder="名前"><br><br>
<input type="file" id="file"><br><br>
<button onclick="upload()">送信</button>

<script>
function upload() {
  const file = document.getElementById('file').files[0];
  const reader = new FileReader();

  reader.onload = function() {
    const base64 = reader.result.split(',')[1];

    // 👇 ここがポイント（追加部分）
    fetch("https://280f681b44d7ef19a1c9c1de4d1b9b.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f9656bca52304caf86316e1810ea1b12/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=AnQow9BIK1LV7BM_Wl4iwu95aqvbRSqb1ypzmule3Tk", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: document.getElementById("name").value,
        fileName: file.name,
        fileContent: base64
      })
    });

    alert("送信しました！");
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
