<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
}

.header {
  background: #fff;
  padding: 16px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  overflow: hidden;
}

.logo {
  max-width: 90%;
  max-height: 60px;
  width: auto;
  height: auto;
}


.form-title {
  margin-top: 12px;
  margin-bottom: 6px;
  font-size: clamp(18px, 5vw, 28px);
  font-weight: bold;
  color: #333;
}

.form-description {
  margin: 0;
  font-size: clamp(12px, 3vw, 16px);
  color: #666;
  line-height: 1.5;
  white-space: pre-line;
}

#formArea {
  padding: 16px;
  padding-bottom: 100px;
}


  
#formArea div {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}


label {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
  color: #444;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
  box-sizing: border-box; 
}

/* ✅ ファイル＋カメラ横並び */
.file-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.file-row input[type="file"] {
  flex: 1;
}

.camera-btn {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: #eee;
  font-size: 16px;
  white-space: nowrap;
  cursor: pointer;
}

/* サムネ */
.preview {
  width: 80px;
  margin-top: 10px;
  display: none;
}

/* 送信ボタン */
button.submit {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 16px;
  font-size: 18px;
  background: #6264a7;
  color: #fff;
  border: none;
}

.spinner {
  display: none;
  width: 20px;
  height: 20px;
  border: 3px solid #fff;
  border-top: 3px solid transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-left: 10px;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* =====================
   SCAN MODAL
===================== */

#scanModal {
  display: none;

  position: fixed;
  inset: 0;

  background: rgba(0,0,0,0.75);

  z-index: 9999;

  justify-content: center;
  align-items: center;
}

.scan-container {
  width: 96%;
  max-width: 800px;

  background: white;
  border-radius: 16px;
  padding: 16px;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
  position: relative;
}

.scan-title {

  text-align: center;

  font-size: 18px;
  font-weight: bold;

  margin-bottom: 12px;
}

#reader {
  width: 100%;
  height: 45vh;
  min-height: 300px;
  max-height: 450px;
  overflow: hidden;
  position: relative;
}


.cancel-scan-btn {

  width: 100%;

  margin-top: 12px;

  padding: 12px;

  background: #d83b01;

  color: white;

  border: none;

  border-radius: 8px;

  font-size: 16px;

  cursor: pointer;
}
#scanGuide {

  position: absolute;

  left: 50%;
  top: 50%;

  width: 80%;
  height: 100px;

  transform: translate(-50%, -50%);

  border: 3px solid #00ff66;

  border-radius: 12px;

  pointer-events: none;
  z-index: 10;

box-shadow:
  0 0 0 9999px rgba(0,0,0,0.45),
  0 0 15px rgba(0,255,100,0.8);
}

  #barcode-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>

<body>

<div class="header">
  <img id="logo" class="logo">
  <h1 id="formTitle" class="form-title"></h1>
  <p id="formDescription" class="form-description"></p>
</div>

<div id="formArea"></div>

<!-- スキャンモーダル -->
<div id="scanModal">

  <div class="scan-container">

    <div class="scan-title">
      バーコード / QRコード読取
    </div>

<div id="reader">
  <div id="scanGuide"></div>

<canvas
  id="scanCanvas"
  style="
    width:100%;
    border:2px solid red;
  ">
</canvas>

    <div style="margin-top:10px;">
  🔍ズーム
  <input
    type="range"
    id="zoomSlider"
    min="1"
    max="5"
    step="0.1"
    value="1"
    style="width:100%;">
</div>
    
    <button
      id="cancelScanBtn"
      type="button"
      class="cancel-scan-btn"
    >
      ❌ スキャン中止
    </button>

  </div>

</div>
  
<button id="submitBtn" class="submit" onclick="submitForm()">
  <span id="btnText">送信</span>
  <span id="spinner" class="spinner"></span>
</button>

<script>

const formType = new URLSearchParams(location.search).get("form");
const requestId =  new URLSearchParams(location.search).get("id");
const draftKey = "draft_" + formType;
let draft = {};


let codeReader = null;
let currentControls = null;
let currentTrack = null;
let scanRunning = false;


// 下書き取得
try {
  draft = JSON.parse(localStorage.getItem(draftKey)) || {};
} catch {
  draft = {};
}

// JSON読み込み
fetch(`./forms/${formType}.json`)
  .then(res => res.json())
  .then(config => {

    
    console.log("formType:", formType);
    console.log("currentConfig BEFORE:", window.currentConfig);
    console.log("config:", config);

setLogo(config.logo);
setTitle(config.title);
setDescription(config.description);

window.currentConfig = config;
renderForm(config.fields);
  })
  .catch(err => {
    console.error(err);
    alert("フォーム読み込みエラー");
  });


function setLogo(logoPath) {
  document.getElementById("logo").src = logoPath || "/logo.png";
}
function setTitle(title) {
  document.getElementById("formTitle").textContent =
    title || "";
}

function setDescription(description) {
  document.getElementById("formDescription").textContent =
    description || "";

}

async function startBarcodeScanner(targetBind) {

  if (scanRunning) return;

  scanRunning = true;

  document.getElementById(
    "scanModal"
  ).style.display = "flex";

  const video =
    document.getElementById("reader");

video.innerHTML =
  '<video id="barcode-video"></video>' +
  '<div id="scanGuide"></div>' +
  '<canvas id="scanCanvas" style="display:none;"></canvas>';

const videoElement =
  document.getElementById(
    "barcode-video"
  );

videoElement.setAttribute(
  "playsinline",
  true
);

  try {

  const stream =
    await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        }
      }
    });

  currentTrack =
    stream.getVideoTracks()[0];

  videoElement.srcObject = stream;

  await videoElement.play();

  const zoomSlider =
    document.getElementById("zoomSlider");

const capabilities =
  currentTrack.getCapabilities
    ? currentTrack.getCapabilities()
    : {};
    
if (
  capabilities.zoom &&
  capabilities.zoom.min != null &&
  capabilities.zoom.max != null
) {

  zoomSlider.min =
    capabilities.zoom.min;

  zoomSlider.max =
    capabilities.zoom.max;

  zoomSlider.step =
    capabilities.zoom.step || 0.1;

  zoomSlider.value =
    Math.min(
      1.5,
      capabilities.zoom.max
    );

  await currentTrack.applyConstraints({
    advanced: [{
      zoom: Number(
        zoomSlider.value
      )
    }]
  });

} else {

  zoomSlider.style.display =
    "none";
}

    await currentTrack.applyConstraints({
      advanced: [{
        zoom: Number(
          zoomSlider.value
        )
      }]
    });

    zoomSlider.oninput =
      async function () {

        try {

          await currentTrack.applyConstraints({
            advanced: [{
              zoom: Number(
                this.value
              )
            }]
          });

        } catch (e) {

          console.log(e);

        }
      };
  }



  codeReader =
    new ZXingBrowser.BrowserMultiFormatReader();

    scanGuideArea(
  videoElement,
  targetBind
);

currentControls =
  await codeReader.decodeFromVideoElement(
    videoElement,
    async (result, err) => {

if (result) {

  if (!scanRunning) return;
  scanRunning = false;

  const decodedText =
    result.getText();

        const input =
          document.querySelector(
            `[data-bind="${targetBind}"]`
          );

        if (input) {

          input.value = decodedText;

          saveDraft(
            targetBind,
            decodedText
          );

          input.dispatchEvent(
            new Event("input")
          );
        }

 

        await closeScanner();

        setTimeout(() => {

          alert(
            "読取成功\n\n" +
            decodedText
          );

        }, 100);
      }
    }
  );
} catch (err) {

  console.error(err);

  await closeScanner();

  alert(
    "カメラ起動失敗\n\n" +
    err
  );
}
}
 async function scanGuideArea(
  videoElement,
  targetBind
) {

  if (!scanRunning) {
    return;
  }

  const canvas =
    document.getElementById(
      "scanCanvas"
    );

  const ctx =
    canvas.getContext("2d");

  const vw =
    videoElement.videoWidth;

  const vh =
    videoElement.videoHeight;

  if (!vw || !vh) {

    requestAnimationFrame(() =>
      scanGuideArea(
        videoElement,
        targetBind
      )
    );

    return;
  }

  const cropX =
    vw * 0.1;

  const cropY =
    vh * 0.44;

  const cropWidth =
    vw * 0.8;

  const cropHeight =
    vh * 0.12;

  canvas.width =
    cropWidth;

  canvas.height =
    cropHeight;

  ctx.drawImage(
    videoElement,

    cropX,
    cropY,

    cropWidth,
    cropHeight,

    0,
    0,

    cropWidth,
    cropHeight
  );

  console.log(
    "Canvas updated"
  );

  requestAnimationFrame(() =>
    scanGuideArea(
      videoElement,
      targetBind
    )
  );
}
// 下書き保存
function saveDraft(key, value) {
  draft[key] = value;
  localStorage.setItem(draftKey, JSON.stringify(draft));
}

// フォーム生成
function renderForm(fields) {
  const area = document.getElementById("formArea");

  fields.forEach(item => {
    const div = document.createElement("div");

const label = document.createElement("label");

label.innerHTML =
  item.label +
  (item.required
    ? ' <span style="color:red;">*</span>'
    : '');

div.appendChild(label);

    // TEXT
   
if (item.type === "text") {
  const input = document.createElement("input");
  input.type = "text";
  input.dataset.bind = item.bind;
  input.required = item.required || false;
  input.value = draft[item.bind] || "";

  input.oninput = () => saveDraft(item.bind, input.value);
  div.appendChild(input);

  // ✅ バーコードボタン
if (item.enableScan) {

  // リアルタイムスキャン
  const scanBtn = document.createElement("button");
  scanBtn.textContent = "📷SCAN";
  scanBtn.type = "button";
  scanBtn.style.marginTop = "8px";
  scanBtn.style.marginRight = "8px";

  scanBtn.onclick =
    () => startBarcodeScanner(item.bind);

  div.appendChild(scanBtn);

}
}


  // ✅ TEXTAREA
    if (item.type === "textarea") {
      const textarea = document.createElement("textarea");
      textarea.dataset.bind = item.bind;
      textarea.rows = 4;
      textarea.value = draft[item.bind] || "";
      textarea.required = item.required || false;
      textarea.oninput = () => saveDraft(item.bind, textarea.value);
      
    div.appendChild(textarea);
    }

    // SELECT
    if (item.type === "select") {
  const select = document.createElement("select");
  select.dataset.bind = item.bind;
  select.required = item.required || false;     

  item.options.forEach(opt => {
    const option = document.createElement("option");
    option.value = opt;
    option.text = opt;
    select.appendChild(option);
  });

  select.value = draft[item.bind] || "";

  div.appendChild(select);

  // ✅ その他入力欄（自動生成）
  let otherInput = null;

  if (item.allowOther) {
    otherInput = document.createElement("input");
    otherInput.type = "text";
    otherInput.placeholder = "具体的に入力";
    otherInput.dataset.bind = item.bind + "_other";
    otherInput.value = draft[item.bind + "_other"] || "";

    // 初期表示制御
    otherInput.style.display =
      select.value === "その他" ? "block" : "none";

    otherInput.oninput = () =>
      saveDraft(otherInput.dataset.bind, otherInput.value);

    div.appendChild(otherInput);
  }

  // ✅ 選択変更時
  select.onchange = () => {
    saveDraft(item.bind, select.value);

    if (item.allowOther && otherInput) {
      otherInput.style.display =
        select.value === "その他" ? "block" : "none";
    }
  };
}
    // ✅ FILE（カメラボタン付き）
    if (item.type === "file") {

      const wrapper = document.createElement("div");
      wrapper.className = "file-row";

      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*,.pdf";
      input.dataset.bind = item.bind;
      input.required = item.required || false;

      // カメラボタン
      const cameraBtn = document.createElement("button");
      cameraBtn.textContent = "📷";
      cameraBtn.type = "button";
      cameraBtn.className = "camera-btn";

      cameraBtn.onclick = () => {
        input.capture = "environment"; // 背面カメラ
        input.click();
      };

      const preview = document.createElement("img");
      preview.className = "preview";

      // 復元
if (
  draft[item.bind] &&
  draft[item.bind].startsWith("data:image")
) {
  preview.src = draft[item.bind];
  preview.style.display = "block";
}

input.onchange = async () => {

  const file = input.files[0];
  if (!file) return;

  // 拡張子チェック
  const ext =
    file.name.split(".").pop().toLowerCase();

  if (!allowedExtensions.includes(ext)) {

    alert(
      "対応形式は JPG / JPEG / PNG / HEIC / HEIF / PDF のみです"
    );

    input.value = "";
    return;
  }

  // サイズチェック
  if (file.size > MAX_SIZE) {

    alert(
      "ファイルサイズは20MB以下にしてください"
    );

    input.value = "";
    return;
  }

  const base64 = await readFile(file);

  // PDFはプレビューしない
  if (ext !== "pdf") {
    preview.src = base64;
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }

  saveDraft(item.bind, base64);
};

      wrapper.appendChild(input);
      wrapper.appendChild(cameraBtn);

      div.appendChild(wrapper);
      div.appendChild(preview);
    }

    area.appendChild(div);
  });
}

// base64変換
// 許可する拡張子
const allowedExtensions = [
  "jpg",
  "jpeg",
  "png",
  "heic",
  "heif",
  "pdf"
];

// 最大20MB
const MAX_SIZE = 20 * 1024 * 1024;

function readFile(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

// 送信
// 送信

async function closeScanner() {

  try {

if (currentControls) {
  currentControls.stop();
}

if (currentTrack) {
  currentTrack.stop();
}

if (codeReader?.stop) {
  codeReader.stop();
}


  } catch (e) {

    console.log(e);

  }

  document.getElementById(
    "scanModal"
  ).style.display = "none";

  document.getElementById(
    "reader"
  ).innerHTML = "";

codeReader = null;
currentControls = null;
currentTrack = null;
scanRunning = false;
}

  
async function submitForm() {

 // ====================
  // 必須チェック
  // ====================
  for (const item of window.currentConfig.fields) {

    if (!item.required) {
      continue;
    }

    // ファイル
    if (item.type === "file") {

      if (!draft[item.bind]) {

        alert(item.label + " は必須です");

        return;
      }

    } else {

      const field =
        document.querySelector(
          `[data-bind="${item.bind}"]`
        );

      if (!field || !field.value.trim()) {

        alert(item.label + " は必須です");

        field?.focus();

        return;
      }
    }
  }

  const btn = document.getElementById("submitBtn");
  const text = document.getElementById("btnText");
  const spinner = document.getElementById("spinner");

  text.textContent = "送信中...";
  spinner.style.display = "inline-block";
  btn.disabled = true;

const payload = {
  timestamp: new Date().toISOString(),
  formType: formType,

  requestId: requestId,
  
  formGroup: window.currentConfig.formGroup,

  parameter1: window.currentConfig.parameter1 || "",
  parameter2: window.currentConfig.parameter2 || "",
  parameter3: window.currentConfig.parameter3 || "",
  parameter4: window.currentConfig.parameter4 || "",

  userAgent: navigator.userAgent,
  images: []
};

 for (const field of document.querySelectorAll("[data-bind]")) {

  const key = field.dataset.bind;

  if (
    field.type === "text" ||
    field.tagName === "SELECT" ||
    field.tagName === "TEXTAREA"
  ) {
    payload[key] = field.value;
  }

  if (field.type === "file") {
    if (draft[key]) {
      payload.images.push({
        name: key,
        data: draft[key]
      });
    }
  }
}  

function normalizePayload(payload) {
  Object.keys(payload).forEach(key => {

    if (payload[key] === "その他") {

      const otherKey = key + "_other";

      if (payload[otherKey]) {
        payload[key] = `その他(${payload[otherKey]})`;
        delete payload[otherKey];
      }
    }
  });
}

normalizePayload(payload);


  try {

  const response = await fetch(
    "https://280f681b44d7ef19a1c9c1de4d1b9b.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/13/workflows/1535fe4d09cd48e18ec3c3bfdb07f4e9/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=4jDk9r_8fA3rJ7fzeMGW-egCmVKePH1RjRqrOQjWMbk",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    }
  );

  if (!response.ok) {
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  localStorage.removeItem(draftKey);

  text.textContent = "送信完了 ✅";
  spinner.style.display = "none";

  setTimeout(() => {
    text.textContent = "送信";
    btn.disabled = false;
    location.reload();
  }, 1500);

} catch (e) {

  console.error(e);

  alert(
    "送信に失敗しました\n\n" + e
  );

  text.textContent = "送信";
  spinner.style.display = "none";
  btn.disabled = false;
}


}
window.addEventListener("load", () => {

  document
    .getElementById("cancelScanBtn")
    ?.addEventListener(
      "click",
      closeScanner
    );

});
</script>

</body>
</html>
