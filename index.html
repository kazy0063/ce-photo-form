<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: -apple-system, sans-serif;
  background: #f2f4f7;
  margin: 0;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}

h2 {
  text-align: center;
}

label {
  font-size: 14px;
  font-weight: bold;
}

input[type="file"] {
  margin-top: 8px;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin-top: 20px;
  background: #007aff;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
<h2>写真提出フォーム</h2>

<div class="card">
  <label>現状写真1</label>
  <input type="file" id="photo1" accept="image/*" capture="environment">
</div>

<div class="card">
  <label>現状写真2</label>
  <input type="file" id="photo2" accept="image/*" capture="environment">
</div>

<div class="card">
  <label>レジ台写真</label>
  <input type="file" id="photo3" accept="image/*" capture="environment">
</div>

<div class="card">
  <label>電源写真</label>
  <input type="file" id="photo4" accept="image/*" capture="environment">
</div>

<button onclick="submitForm()">送信</button>

</div>

<script>
async function submitForm() {

  const p1 = document.getElementById("photo1").files[0];
  const p2 = document.getElementById("photo2").files[0];
  const p3 = document.getElementById("photo3").files[0];
  const p4 = document.getElementById("photo4").files[0];

  // 未選択チェック
  if (!p1 || !p2 || !p3 || !p4) {
    alert("4枚すべて選択してください");
    return;
  }

  const formData = new FormData();

  formData.append("timestamp", new Date().toISOString());
  formData.append("photo1", p1);
  formData.append("photo2", p2);
  formData.append("photo3", p3);
  formData.append("photo4", p4);

  try {
    await fetch("https://280f681b44d7ef19a1c9c1de4d1b9b.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/962b9cab1f5c48b39cf8ed523ecc79a5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=2eZQj9P5qbGAeZV017KO2K4xZciPgyxY9CFkyFTR664", {
      method: "POST",
      body: formData
    });

    alert("送信完了");

  } catch (error) {
    console.error(error);
    alert("送信エラー");
  }
}
</script>

</body>
</html>
