<script>

const formType = new URLSearchParams(location.search).get("form");

fetch(`./forms/${formType}.json`)
  .then(res => res.json())
  .then(config => {
    setLogo(config.logo);
    renderForm(config.fields);
    window.currentConfig = config;
  });

function setLogo(logoPath) {
  const logo = document.getElementById("logo");
  logo.src = logoPath || "/logo.png";
}

function renderForm(fields) {

  const area = document.getElementById("formArea");

  fields.forEach(item => {

    const div = document.createElement("div");
    div.className = "card";

    const label = document.createElement("label");
    label.textContent = item.label;
    div.appendChild(label);

    if (item.type === "text") {
      const input = document.createElement("input");
      input.type = "text";
      input.dataset.bind = item.bind;
      div.appendChild(input);
    }

    if (item.type === "select") {
      const select = document.createElement("select");
      select.dataset.bind = item.bind;

      item.options.forEach(opt => {
        const option = document.createElement("option");
        option.value = opt;
        option.text = opt;
        select.appendChild(option);
      });

      div.appendChild(select);

      if (item.hasOther) {
        const other = document.createElement("input");
        other.type = "text";
        other.style.display = "none";
        other.dataset.bind = item.bind + "_other";

        select.addEventListener("change", () => {
          other.style.display = (select.value === "その他") ? "block" : "none";
        });

        div.appendChild(other);
      }
    }

    if (item.type === "file") {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.capture = "environment";
      input.dataset.bind = item.bind;
      div.appendChild(input);
    }

    area.appendChild(div);
  });
}
``

// base64変換
async function readFile(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

// 送信
async function submitForm() {

  const payload = {
    timestamp: new Date().toISOString(),
    formType: window.currentConfig.formType
  };

  for (const field of document.querySelectorAll("[data-bind]")) {

    const key = field.dataset.bind;

    // text/select
    if (field.type === "text" || field.tagName === "SELECT") {
      payload[key] = field.value;
    }

    // file
    if (field.type === "file") {
      if (field.files[0]) {
        payload[key] = await readFile(field.files[0]);
      }
    }
  }

  console.log(payload);

  await fetch("https://280f681b44d7ef19a1c9c1de4d1b9b.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/13447be074b2425ab229f956f6faf702/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=KUSuR-p13NP_l_XGo0B3k_jXRXDg6B9bJpFyr-mPVH0", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  alert("送信完了");
}

</script>
