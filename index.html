<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: -apple-system, sans-serif;
  background: #f2f4f7;
  margin: 0;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}

h2 {
  text-align: center;
}

label {
  font-size: 14px;
  font-weight: bold;
}

.input-group {
  margin-top: 8px;
}

.input-group button {
  margin-right: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: white;
}

/* サムネ */
.preview img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}

button.submit {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin-top: 20px;
  background: #007aff;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
<h2>写真提出フォーム</h2>

<div id="formArea"></div>

<button class="submit" onclick="submitForm()">送信</button>

</div>

<script>

// ============================
// フォーム生成
// ============================
function createPhotoBlock(id, labelText) {
  return `
  <div class="card">
    <label>${labelText}</label>

    <div class="input-group">
      <button onclick="openCamera('${id}')">📷 カメラ</button>
      <button onclick="openLibrary('${id}')">📁 ライブラリ</button>
    </div>

    <input type="file" id="${id}" accept="image/*" style="display:none" onchange="previewImage('${id}')">
