<script>

const DB_NAME = "FieldFormDB";
const DB_VERSION = 1;
const STORE_NAME = "submissions";

function toggleBottomBar() {

  const bottomBar =
    document.getElementById(
      "bottomBar"
    );

  const pageHeight =
    document.documentElement.scrollHeight;

  const viewportHeight =
    window.innerHeight;

  // スクロール不要なら常時表示
  if (
    pageHeight <= viewportHeight
  ) {

    bottomBar.classList.add(
      "show"
    );

    return;
  }

  const scrollBottom =
    window.scrollY +
    viewportHeight;

  if (
    scrollBottom >=
    pageHeight - 300
  ) {

    bottomBar.classList.add(
      "show"
    );

  } else {

    bottomBar.classList.remove(
      "show"
    );
  }
}

  
function openDB() {
  return new Promise((resolve, reject) => {

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

    request.onupgradeneeded = e => {

      const db =
        e.target.result;

      if (
        !db.objectStoreNames.contains(
          STORE_NAME
        )
      ) {

        const store =
          db.createObjectStore(
            STORE_NAME,
            {
              keyPath: "id"
            }
          );

        store.createIndex(
          "status",
          "status"
        );

        store.createIndex(
          "createdAt",
          "createdAt"
        );
      }
    };

    request.onsuccess =
      () => resolve(request.result);

    request.onerror =
      () => reject(request.error);

  });
}

const formType = new URLSearchParams(location.search).get("form");
const requestId =  new URLSearchParams(location.search).get("id");
const draftKey =
  `draft_${formType}_${requestId || "default"}`;
let draft = {};


let codeReader = null;
let currentControls = null;
let currentTrack = null;
let scanRunning = false;


// 下書き取得
try {
  draft = JSON.parse(localStorage.getItem(draftKey)) || {};
} catch {
  draft = {};
}

// JSON読み込み
fetch(`./forms/${formType}.json`)
  .then(res => res.json())
  .then(config => {

    
    console.log("formType:", formType);
    console.log("currentConfig BEFORE:", window.currentConfig);
    console.log("config:", config);

setLogo(config.logo);
setTitle(config.title);
setRequestInfo();
setDescription(config.description);

window.currentConfig = config;
renderForm(config.fields);
const restoreId =
  localStorage.getItem(
    "restoreSubmissionId"
  );

if (restoreId) {

  localStorage.removeItem(
    "restoreSubmissionId"
  );

  restoreSubmission(
    restoreId
  );
}
setTimeout(
  toggleBottomBar,
  100
);
  })
  .catch(err => {
    console.error(err);
    alert("フォーム読み込みエラー");
  });


function setLogo(logoPath) {
  document.getElementById("logo").src = logoPath || "/logo.png";
}
function setTitle(title) {
  document.getElementById("formTitle").textContent =
    title || "";
}

function setRequestInfo() {

  const requestInfo =
    document.getElementById(
      "requestInfo"
    );

  if (requestId) {

      requestInfo.innerHTML =
  `このフォームは
   <span style="color:red">
     ${requestId}
   </span>
   用です。数字部分が店舗番号となります。`;

  } else {

    requestInfo.textContent = "";
  }
}


function setDescription(description) {
  document.getElementById("formDescription").textContent =
    description || "";

}

async function showHistory() {

  const items =
    await getAllSubmissions();

  const list =
    document.getElementById(
      "historyList"
    );

  list.innerHTML = "";

  items
    .sort(
      (a,b) =>
        new Date(
          b.createdAt
        ) -
        new Date(
          a.createdAt
        )
    )
    .forEach(item => {

      const div =
        document.createElement(
          "div"
        );

      div.style.border =
        "1px solid #ccc";

      div.style.padding =
        "10px";

      div.style.marginBottom =
        "10px";

const icon =
  item.status === "sent"
    ? "✅"
    : item.status === "error"
    ? "❌"
    : item.status === "draft"
    ? "💾"
    : "⏳";
      
const imageInfo =
  item.status === "sent"
    ? "✅送信済み（復元不可）"
    : item.payload?.images?.length
    ? "📷写真あり"
    : "";

div.innerHTML = `
  <div>
    ${icon}
    ${new Date(item.createdAt).toLocaleString("ja-JP")}
  </div>

<div>
 ${item.payload.formType || ""}
<br>
ID: ${item.payload.requestId || ""}
</div>

<div>
  ${imageInfo}
</div>

<div>

  ${
    item.status !== "sent"
    ? `
      <button
        onclick="restoreSubmission('${item.id}')">
        📂復元
      </button>
    `
    : ""
  }

  ${
    item.status === "error"
    ? `
      <button
        onclick="resendSubmission('${item.id}')">
        🔄再送
      </button>
    `
    : ""
  }

</div>
`;

      list.appendChild(div);

    });

  document.getElementById(
    "historyModal"
  ).style.display =
    "block";
}

async function restoreSubmission(id) {

 
  const record =
    await getSubmissionById(id);

  if (!record) {

    alert(
      "データが見つかりません"
    );

    return;
  }

const payload =
  record.payload;

if (
  payload.pageUrl &&
  payload.pageUrl !== location.href
) {

  localStorage.setItem(
    "restoreSubmissionId",
    id
  );

  location.href =
    payload.pageUrl;

  return;
}

  for (
    const field of
    document.querySelectorAll(
      "[data-bind]"
    )
  ) {

    const key =
      field.dataset.bind;

    if (
      payload[key] !== undefined
    ) {

      field.value =
        payload[key];

      saveDraft(
        key,
        payload[key]
      );
    }
  }
if (payload.images) {

  payload.images.forEach(img => {

    draft[img.name] =
      img.data;

    const preview =
      document.querySelector(
        `[data-preview="${img.name}"]`
      );

    if (
      preview &&
      img.data.startsWith(
        "data:image"
      )
    ) {

      preview.src =
        img.data;

      preview.style.display =
        "block";
    }

  });

  localStorage.setItem(
    draftKey,
    JSON.stringify(draft)
  );
}
  document
    .getElementById(
      "historyModal"
    )
    .style.display =
      "none";

  alert(
    "復元しました"
  );
}

async function getSubmissionById(
  id
) {

  const db =
    await openDB();

  const tx =
    db.transaction(
      STORE_NAME,
      "readonly"
    );

  const store =
    tx.objectStore(
      STORE_NAME
    );

  return new Promise(
    (resolve,reject) => {

      const req =
        store.get(id);

      req.onsuccess =
        () =>
          resolve(
            req.result
          );

      req.onerror =
        () =>
          reject(
            req.error
          );
    }
  );
}

async function resendSubmission(
  id
) {

  const record =
    await getSubmissionById(
      id
    );

  if (!record) {

    alert(
      "履歴が見つかりません"
    );

    return;
  }

  try {

    const response =
      await fetch(
        "https://280f681b44d7ef19a1c9c1de4d1b9b.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/13/workflows/1535fe4d09cd48e18ec3c3bfdb07f4e9/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=4jDk9r_8fA3rJ7fzeMGW-egCmVKePH1RjRqrOQjWMbk",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify(
              record.payload
            )
        }
      );

    if (
      !response.ok
    ) {

      throw new Error(
        response.status
      );
    }

    await updateSubmissionStatus(
      id,
      "sent"
    );

    alert(
      "再送成功"
    );

    await showHistory();

  } catch (e) {

    await updateSubmissionStatus(
      id,
      "error"
    );

    alert(
      "再送失敗"
    );
  }
}

);

  const stream =
    await navigator.mediaDevices.getUserMedia({

) {

} else {

  zoomSlider.style.display = "none";

}



  codeReader =
    new ZXingBrowser.BrowserMultiFormatReader();

    scanGuideArea(
  videoElement,
  targetBind
);

decodeCanvas(
  targetBind

async function scanGuideArea(
  videoElement,
  targetBind
) {

  if (!scanRunning) {
    return;
  }

  const canvas =
    document.getElementById(
      "scanCanvas"
    );

  if (!canvas) {
    return;
  }

  const ctx =
    canvas.getContext("2d");

  const vw =
    videoElement.videoWidth;

  const vh =
    videoElement.videoHeight;

if (!vw || !vh) {

  setTimeout(() => {
    scanGuideArea(
      videoElement,
      targetBind
    );
  }, 100);

  return;
}

const cropX = vw * 0.1;
const cropY = vh * 0.35;

const cropWidth = vw * 0.8;
const cropHeight = vh * 0.3;

  canvas.width =
    cropWidth;

  canvas.height =
    cropHeight;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(
    videoElement,

    cropX,
    cropY,

    cropWidth,
    cropHeight,

    0,
    0,

    cropWidth,
    cropHeight
  );
setTimeout(() => {
  scanGuideArea(
    videoElement,
    targetBind
  );
}, 100);

}
async function decodeCanvas(
  targetBind
) {


  if (!scanRunning) {
    return;
  }

  const canvas =
    document.getElementById(
      "scanCanvas"
    );



  try {

    const result =
      await codeReader.decodeFromCanvas(
        canvas
      );


    

if (result) {

  const decodedText =
    result.getText();

  if (navigator.vibrate) {
    navigator.vibrate([100, 50, 100]);
  }

  const input =
    document.querySelector(
      `[data-bind="${targetBind}"]`
    );

  if (input) {

    input.value =
      decodedText;

    saveDraft(
      targetBind,
      decodedText
    );
  }

  await closeScanner();


  return;
}

  } catch (e) {

  }

  setTimeout(
    () =>
      decodeCanvas(
        targetBind
      ),
    200
  );

}
// 下書き保存
function saveDraft(key, value) {
  draft[key] = value;
  localStorage.setItem(draftKey, JSON.stringify(draft));
}
  
async function saveAsDraft() {

const payload = {
  timestamp: new Date().toISOString(),
  formType: formType,
  requestId: requestId,

  pageUrl: location.href,

  images:[]
};

  for (
    const field of
    document.querySelectorAll(
      "[data-bind]"
    )
  ) {

    const key =
      field.dataset.bind;

    if (
      field.type === "text" ||
      field.tagName === "TEXTAREA" ||
      field.tagName === "SELECT"
    ) {

      payload[key] =
        field.value;
    }

    if (
      field.type === "file" &&
      draft[key]
    ) {

      payload.images.push({
        name:key,
        data:draft[key]
      });
    }
  }

  payload.backupId =
    "draft_" +
    Date.now();

  await saveSubmission(
    payload,
    "draft"
  );

  alert(
    "途中保存しました"
  );
}
  
async function saveSubmission(
  payload,
  status = "pending"
) {

  const db =
    await openDB();

  const tx =
    db.transaction(
      STORE_NAME,
      "readwrite"
    );

  const store =
    tx.objectStore(
      STORE_NAME
    );

  const record = {

    id:
      payload.backupId,

    createdAt:
      new Date().toISOString(),

    status,

    payload
  };

  store.put(record);

  return new Promise(resolve => {
    tx.oncomplete = resolve;
  });
}

async function updateSubmissionStatus(
  id,
  status
) {

  const db =
    await openDB();

  const tx =
    db.transaction(
      STORE_NAME,
      "readwrite"
    );

  const store =
    tx.objectStore(
      STORE_NAME
    );

  const req =
    store.get(id);

req.onsuccess = () => {

  const item =
    req.result;

  if (!item) {

    console.warn(
      "backup not found",
      id
    );

    return;
  }

  item.status = status;

  item.updatedAt =
    new Date().toISOString();

  store.put(item);
};
}

async function getAllSubmissions() {

  const db =
    await openDB();

  const tx =
    db.transaction(
      STORE_NAME,
      "readonly"
    );

  const store =
    tx.objectStore(
      STORE_NAME
    );

  return new Promise(
    (resolve, reject) => {

      const req =
        store.getAll();

      req.onsuccess =
        () => {

          const data =
            req.result.sort(
              (a, b) =>
                new Date(
                  b.createdAt
                ) -
                new Date(
                  a.createdAt
                )
            );

          resolve(data);
        };

      req.onerror =
        () => reject(req.error);

    }
  );
}

// base64変換
// 許可する拡張子
const allowedExtensions = [
  "jpg",
  "jpeg",
  "png",
  "heic",
  "heif",
  "pdf"
];

// 最大20MB
const MAX_SIZE = 20 * 1024 * 1024;

function readFile(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

// 送信

async function compressImage(file) {

  const img =
    await createImageBitmap(file);

  const canvas =
    document.createElement("canvas");

  let width = img.width;
  let height = img.height;

  const maxSize = 1600;

  if (
    width > maxSize ||
    height > maxSize
  ) {

    if (width > height) {

      height =
        height *
        (maxSize / width);

      width =
        maxSize;

    } else {

      width =
        width *
        (maxSize / height);

      height =
        maxSize;
    }
  }

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );

  return canvas.toDataURL(
    "image/jpeg",
    0.7
  );
}
